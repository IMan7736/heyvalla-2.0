# Fly.io API (Singapore). Deploy from the repo root:
#   fly deploy apps/api --config infra/fly.toml   (apps/api is the Docker build context)
# Secrets are set with `fly secrets set`, never in this file (see docs/DEPLOY.md).
app = "dhathuru-api"
primary_region = "sin"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Database__Port = "5432"
  Database__Username = "postgres"
  # Fly private network: the only proxies whose X-Forwarded-For the API trusts (keeps per-client rate limits honest).
  Proxy__KnownNetworks__0 = "172.16.0.0/12"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep exactly one machine running. Planner option ids, the email queue and repeat-email cooldowns live in process
  # memory (InMemoryOptionStore, QueuedEmailSender, IMemoryCache), so a stop, a restart or a second machine loses
  # them: /trip/<id> and "Book this trip" then answer OPTION_NOT_FOUND. Run `fly scale count 1` after the first
  # deploy (fly deploy creates two machines by default). Revisit when those stores are persisted.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  method = "GET"
  path = "/v1/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
