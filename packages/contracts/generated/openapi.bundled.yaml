components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Instant:
      type: string
      format: date-time
      description: ISO 8601 timestamp with explicit offset. Stored and transported in UTC; shown in Indian/Maldives (UTC+5).
      examples:
        - '2026-10-27T02:30:00Z'
    Health:
      type: object
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
        time:
          $ref: '#/components/schemas/Instant'
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - up
              - down
    Probe:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          maxLength: 80
        locale:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is stable and machine readable; `params` fill the client-side translated message. No English prose is required by clients.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          examples:
            - https://dhathuru.mv/problems/validation
        title:
          type: string
          examples:
            - Validation failed
        status:
          type: integer
          examples:
            - 422
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code (UPPER_SNAKE).
          examples:
            - VALIDATION_FAILED
        params:
          type: object
          additionalProperties: true
          examples:
            - field: email
        traceId:
          type: string
        errors:
          type: array
          description: Field level errors for validation problems.
          items:
            type: object
            required:
              - field
              - code
            properties:
              field:
                type: string
              code:
                type: string
              params:
                type: object
                additionalProperties: true
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    UserId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - usr_01K8Z3M5Q7R9T2V4W6X8Y0N1P2
    User:
      type: object
      required:
        - id
        - email
        - emailVerified
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        displayName:
          type: string
        locale:
          type: string
          examples:
            - en
        createdAt:
          $ref: '#/components/schemas/Instant'
    DeleteAccountRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
        locale:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ChangeEmailRequest:
      type: object
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          format: email
        password:
          type: string
    Preferences:
      type: object
      required:
        - language
        - riskTolerance
        - preferredModes
      properties:
        language:
          type: string
        riskTolerance:
          type: string
          enum:
            - cautious
            - balanced
            - relaxed
        preferredModes:
          type: array
          items:
            type: string
    UpdatePreferencesRequest:
      type: object
      properties:
        language:
          type: string
        riskTolerance:
          type: string
          enum:
            - cautious
            - balanced
            - relaxed
        preferredModes:
          type: array
          maxItems: 8
          items:
            type: string
    Session:
      type: object
      required:
        - id
        - createdAt
        - lastUsedAt
        - current
      properties:
        id:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        lastUsedAt:
          $ref: '#/components/schemas/Instant'
        userAgent:
          type: string
        networkHint:
          type: string
        current:
          type: boolean
    TravellerId:
      type: string
      pattern: ^trv_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - trv_01K8Z3M5Q7R9T2V4W6X8Y0P1Q2
    PassengerType:
      type: string
      enum:
        - adult
        - child
        - infant
    SavedTraveller:
      type: object
      required:
        - id
        - fullName
        - passengerType
        - documentType
      properties:
        id:
          $ref: '#/components/schemas/TravellerId'
        fullName:
          type: string
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        documentType:
          type: string
          enum:
            - none
            - national_id
            - passport
    TravellerInput:
      type: object
      required:
        - fullName
        - passengerType
      properties:
        fullName:
          type: string
          maxLength: 120
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        documentType:
          type: string
          enum:
            - none
            - national_id
            - passport
          default: none
          description: Kind of ID carried; numbers are never stored.
    PlaceType:
      type: string
      enum:
        - island
        - atoll
        - airport
        - jetty
        - taxi_stand
        - poi
        - address
    PlaceId:
      type: string
      description: Prefixed ULID of a place (island, atoll, airport, jetty, taxi stand, poi or address).
      pattern: ^(isl|atl|apt|jty|txs|poi|adr)_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - isl_01K8Z3M5Q7R9T2V4W6X8Y0A1B2
    LocalisedText:
      type: object
      description: Map of locale tag to text. `en` is always present.
      required:
        - en
      properties:
        en:
          type: string
      additionalProperties:
        type: string
      examples:
        - en: Maafushi
          dv: މާފުށި
    GeoPoint:
      type: object
      required:
        - lat
        - lng
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          examples:
            - 3.9417
        lng:
          type: number
          minimum: -180
          maximum: 180
          examples:
            - 73.4896
    Place:
      type: object
      required:
        - id
        - type
        - name
        - geo
        - isHub
      properties:
        id:
          $ref: '#/components/schemas/PlaceId'
        type:
          $ref: '#/components/schemas/PlaceType'
        name:
          $ref: '#/components/schemas/LocalisedText'
        geo:
          $ref: '#/components/schemas/GeoPoint'
        atollId:
          $ref: '#/components/schemas/PlaceId'
        parentId:
          $ref: '#/components/schemas/PlaceId'
        code:
          type: string
          description: IATA code for airports.
        isHub:
          type: boolean
          description: True where modes interchange (for example a jetty on the airport island).
        approximate:
          type: boolean
          description: True when the coordinates are estimated rather than surveyed.
    PageInfo:
      type: object
      required:
        - limit
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Opaque cursor; null or absent on the last page.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          examples:
            - 50
    OperatorId:
      type: string
      pattern: ^opr_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - opr_01K8Z3M5Q7R9T2V4W6X8Y0C1D2
    TransportMode:
      type: string
      enum:
        - ferry
        - speedboat
        - seaplane
        - domestic_flight
        - bus
        - taxi
        - walk
        - resort_transfer
    ProviderKind:
      type: string
      enum:
        - static
        - mock
        - live
    Operator:
      type: object
      required:
        - id
        - name
        - modes
        - providerKind
      properties:
        id:
          $ref: '#/components/schemas/OperatorId'
        name:
          $ref: '#/components/schemas/LocalisedText'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/TransportMode'
        providerId:
          type: string
          examples:
            - static-mtcc
        providerKind:
          $ref: '#/components/schemas/ProviderKind'
        website:
          type: string
          format: uri
    ServiceId:
      type: string
      pattern: ^svc_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2
    PlaceRef:
      type: object
      description: Lightweight reference embedded in legs.
      required:
        - id
        - type
        - name
        - geo
      properties:
        id:
          $ref: '#/components/schemas/PlaceId'
        type:
          $ref: '#/components/schemas/PlaceType'
        name:
          $ref: '#/components/schemas/LocalisedText'
        geo:
          $ref: '#/components/schemas/GeoPoint'
        code:
          type: string
          description: IATA code for airports.
          examples:
            - MLE
    ServiceDeparture:
      type: object
      required:
        - serviceRunId
        - departAt
        - arriveAt
      properties:
        serviceRunId:
          type: string
          examples:
            - svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2:2026-10-27T02:30Z
        departAt:
          $ref: '#/components/schemas/Instant'
        arriveAt:
          $ref: '#/components/schemas/Instant'
        seatsLeft:
          type: integer
          minimum: 0
    Money:
      type: object
      description: Integer minor units (MVR laari, 100 laari = 1 MVR). Never a float.
      required:
        - amountMinor
        - currency
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          minimum: 0
          examples:
            - 15000
        currency:
          type: string
          enum:
            - MVR
          examples:
            - MVR
    Pricing:
      type: string
      enum:
        - fixed
        - estimate
    Service:
      type: object
      description: A scheduled or on-demand run pattern with calendar validity and fare rules.
      required:
        - id
        - operatorId
        - mode
        - from
        - to
        - kind
        - validity
      properties:
        id:
          $ref: '#/components/schemas/ServiceId'
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        mode:
          $ref: '#/components/schemas/TransportMode'
        kind:
          type: string
          enum:
            - scheduled
            - on_demand
        from:
          $ref: '#/components/schemas/PlaceRef'
        to:
          $ref: '#/components/schemas/PlaceRef'
        departures:
          type: array
          description: Departures for the queried date.
          items:
            $ref: '#/components/schemas/ServiceDeparture'
        validity:
          type: object
          required:
            - from
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            daysOfWeek:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
                description: ISO weekday, 1 = Monday.
        fare:
          type: object
          required:
            - base
          properties:
            base:
              $ref: '#/components/schemas/Money'
            pricing:
              $ref: '#/components/schemas/Pricing'
            childDiscountPercent:
              type: integer
              minimum: 0
              maximum: 100
        checkInCutoffMin:
          type: integer
          minimum: 0
          description: Minutes before departure that boarding or check-in closes.
          examples:
            - 45
        synthetic:
          type: boolean
          description: True when the schedule is estimated or synthetic, not published by the operator.
    ServiceState:
      type: string
      enum:
        - on_time
        - delayed
        - cancelled
        - unknown
    ServiceStatus:
      type: object
      required:
        - serviceId
        - state
        - updatedAt
      properties:
        serviceId:
          $ref: '#/components/schemas/ServiceId'
        serviceRunId:
          type: string
        state:
          $ref: '#/components/schemas/ServiceState'
        delayMinutes:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/Instant'
        source:
          type: string
          enum:
            - static
            - mock
            - live
            - simulated
    Passengers:
      type: object
      required:
        - adults
      properties:
        adults:
          type: integer
          minimum: 1
          maximum: 9
        children:
          type: integer
          minimum: 0
          maximum: 9
          default: 0
        infants:
          type: integer
          minimum: 0
          maximum: 9
          default: 0
          description: Each infant travels on an adult's lap, so infants cannot outnumber adults; otherwise the search answers 422 with field error `passengers.infants` and code `INFANTS_EXCEED_ADULTS`.
    TripPreferences:
      type: object
      required:
        - riskTolerance
      properties:
        maxTransfers:
          type: integer
          minimum: 0
          maximum: 8
        budgetMax:
          $ref: '#/components/schemas/Money'
        modes:
          type: array
          description: Restrict to these modes; omit for all.
          items:
            $ref: '#/components/schemas/TransportMode'
        riskTolerance:
          type: string
          enum:
            - cautious
            - balanced
            - relaxed
    TripSearchRequest:
      type: object
      required:
        - from
        - to
        - date
        - time
        - timeMode
        - passengers
        - preferences
      properties:
        from:
          $ref: '#/components/schemas/PlaceId'
        to:
          $ref: '#/components/schemas/PlaceId'
        date:
          type: string
          format: date
          description: Indian/Maldives local date.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Indian/Maldives local time HH:mm.
        timeMode:
          type: string
          enum:
            - departAfter
            - arriveBy
        passengers:
          $ref: '#/components/schemas/Passengers'
        preferences:
          $ref: '#/components/schemas/TripPreferences'
    SearchId:
      type: string
      pattern: ^srch_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - srch_01K8Z3M5Q7R9T2V4W6X8Y0F1G2
    TripOptionId:
      type: string
      description: Id of a ranked trip option produced by a search.
      pattern: ^trp_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - trp_01K8Z3M5Q7R9T2V4W6X8Y0E1F2
    LegId:
      type: string
      pattern: ^leg_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - leg_01K8Z3M5Q7R9T2V4W6X8Y0G1H2
    Leg:
      type: object
      required:
        - id
        - mode
        - providerId
        - from
        - to
        - departAt
        - arriveAt
        - durationMin
        - price
        - bookable
        - pricing
        - noteCodes
      properties:
        id:
          $ref: '#/components/schemas/LegId'
        mode:
          $ref: '#/components/schemas/TransportMode'
        providerId:
          type: string
          examples:
            - static-mtcc
        serviceId:
          $ref: '#/components/schemas/ServiceId'
        serviceRunId:
          type: string
        from:
          $ref: '#/components/schemas/PlaceRef'
        to:
          $ref: '#/components/schemas/PlaceRef'
        departAt:
          $ref: '#/components/schemas/Instant'
        arriveAt:
          $ref: '#/components/schemas/Instant'
        durationMin:
          type: integer
          minimum: 0
        price:
          $ref: '#/components/schemas/Money'
        bookable:
          type: boolean
        pricing:
          $ref: '#/components/schemas/Pricing'
        geometryRef:
          type: string
          description: Reference resolvable via GET /geo/legs.
          examples:
            - leg_01K8Z3M5Q7R9T2V4W6X8Y0G1H2
        noteCodes:
          type: array
          items:
            type: string
    PriceBreakdownItem:
      type: object
      required:
        - code
        - amount
      properties:
        code:
          type: string
          examples:
            - FERRY_FARE
        amount:
          $ref: '#/components/schemas/Money'
        legId:
          $ref: '#/components/schemas/LegId'
    TripPrice:
      type: object
      required:
        - total
        - breakdown
      properties:
        total:
          $ref: '#/components/schemas/Money'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/PriceBreakdownItem'
    Buffer:
      type: object
      required:
        - afterLegIndex
        - minutes
        - requiredMinutes
        - comfortMinutes
      properties:
        afterLegIndex:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
          description: Planned slack between arrival and the next departure.
        requiredMinutes:
          type: integer
          minimum: 0
          description: Hard minimum; options below it are never produced.
        comfortMinutes:
          type: integer
          minimum: 0
    RiskLevel:
      type: string
      enum:
        - low
        - medium
        - high
    Risk:
      type: object
      required:
        - missProbability
        - level
      properties:
        missProbability:
          type: number
          minimum: 0
          maximum: 1
        level:
          $ref: '#/components/schemas/RiskLevel'
        weakestConnectionIndex:
          type: integer
          minimum: 0
    TripLabel:
      type: string
      enum:
        - fastest
        - cheapest
        - safest
        - best_overall
    Severity:
      type: string
      enum:
        - info
        - good
        - caution
    Explanation:
      type: object
      description: Structured reason. The web owns the English text for each code.
      required:
        - code
        - params
        - severity
      properties:
        code:
          type: string
          examples:
            - BUFFER_COMFORTABLE
        params:
          type: object
          additionalProperties: true
          examples:
            - minutes: 45
        severity:
          $ref: '#/components/schemas/Severity'
    Warning:
      type: object
      required:
        - code
        - params
      properties:
        code:
          type: string
          examples:
            - ESTIMATED_TAXI_FARE
        params:
          type: object
          additionalProperties: true
    TripOption:
      type: object
      required:
        - id
        - departAt
        - arriveAt
        - durationMin
        - transfers
        - legs
        - price
        - buffers
        - risk
        - labels
        - score
        - explanations
        - warnings
      properties:
        id:
          $ref: '#/components/schemas/TripOptionId'
        departAt:
          $ref: '#/components/schemas/Instant'
        arriveAt:
          $ref: '#/components/schemas/Instant'
        durationMin:
          type: integer
          minimum: 0
        transfers:
          type: integer
          minimum: 0
        legs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Leg'
        price:
          $ref: '#/components/schemas/TripPrice'
        buffers:
          type: array
          items:
            $ref: '#/components/schemas/Buffer'
        risk:
          $ref: '#/components/schemas/Risk'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/TripLabel'
        score:
          type: number
        explanations:
          type: array
          items:
            $ref: '#/components/schemas/Explanation'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    TripSearchResponse:
      type: object
      required:
        - searchId
        - options
      properties:
        notices:
          type: array
          description: Codes explaining gaps (no route, closed taxis, suggestions). Present when useful, especially when options is empty.
          items:
            type: object
            required:
              - code
              - params
              - severity
            properties:
              code:
                type: string
              params:
                type: object
                additionalProperties: true
              severity:
                type: string
                enum:
                  - info
                  - good
                  - caution
        suggestions:
          type: array
          description: Present when options is empty. Each suggestion was checked by the engine; applying it yields at least one option.
          items:
            type: object
            required:
              - code
              - params
            properties:
              code:
                type: string
                enum:
                  - TRY_LATER
                  - TRY_EARLIER
                  - TRY_NEXT_DAY
                  - ALLOW_MORE_TRANSFERS
                  - REMOVE_BUDGET
                  - ALLOW_ALL_MODES
              params:
                type: object
                additionalProperties: true
        searchId:
          $ref: '#/components/schemas/SearchId'
        options:
          type: array
          items:
            $ref: '#/components/schemas/TripOption'
    BookingId:
      type: string
      pattern: ^bkg_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - bkg_01K8Z3M5Q7R9T2V4W6X8Y0H1J2
    Disruption:
      type: object
      required:
        - legId
        - kind
      properties:
        legId:
          $ref: '#/components/schemas/LegId'
        kind:
          type: string
          enum:
            - delayed
            - cancelled
        delayMinutes:
          type: integer
          minimum: 1
    ReplanRequest:
      type: object
      required:
        - bookingId
        - now
        - disruption
      properties:
        bookingId:
          $ref: '#/components/schemas/BookingId'
        now:
          $ref: '#/components/schemas/Instant'
        disruption:
          $ref: '#/components/schemas/Disruption'
    LegFeature:
      type: object
      required:
        - type
        - properties
        - geometry
      properties:
        type:
          type: string
          enum:
            - Feature
        properties:
          type: object
          required:
            - legId
            - mode
            - approximate
          properties:
            legId:
              $ref: '#/components/schemas/LegId'
            mode:
              $ref: '#/components/schemas/TransportMode'
            approximate:
              type: boolean
        geometry:
          type: object
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
              enum:
                - LineString
            coordinates:
              type: array
              description: '[lng, lat] pairs.'
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
    LegFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/LegFeature'
    BookingStatus:
      type: string
      enum:
        - draft
        - held
        - payment_pending
        - confirmed
        - failed
        - expired
        - partially_cancelled
        - cancelled
        - refunded
    BookingLegId:
      type: string
      pattern: ^bkl_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - bkl_01K8Z3M5Q7R9T2V4W6X8Y0J1K2
    BookingLegStatus:
      type: string
      enum:
        - pending
        - held
        - confirmed
        - failed
        - cancelled
        - released
    BookingLegDetail:
      type: object
      required:
        - id
        - legIndex
        - leg
        - status
        - amount
      properties:
        id:
          $ref: '#/components/schemas/BookingLegId'
        legIndex:
          type: integer
          minimum: 0
        leg:
          $ref: '#/components/schemas/Leg'
        status:
          $ref: '#/components/schemas/BookingLegStatus'
        providerReference:
          type:
            - string
            - 'null'
        failureCode:
          type:
            - string
            - 'null'
          examples:
            - LEG_UNAVAILABLE
        amount:
          $ref: '#/components/schemas/Money'
    PassengerId:
      type: string
      pattern: ^pax_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - pax_01K8Z3M5Q7R9T2V4W6X8Y0Q1R2
    Passenger:
      type: object
      description: A person on one booking (snapshot; may originate from a Traveller).
      required:
        - id
        - fullName
        - passengerType
      properties:
        id:
          $ref: '#/components/schemas/PassengerId'
        travellerId:
          $ref: '#/components/schemas/TravellerId'
        fullName:
          type: string
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        phone:
          type: string
    PaymentId:
      type: string
      pattern: ^pay_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - pay_01K8Z3M5Q7R9T2V4W6X8Y0M1N2
    PaymentStatusDetail:
      type: string
      enum:
        - pending
        - requires_action
        - succeeded
        - failed
        - refunded
        - partially_refunded
    PaymentChallenge:
      type: object
      required:
        - id
        - kind
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - verification_code
    PaymentDetail:
      type: object
      required:
        - id
        - bookingId
        - amount
        - status
        - gateway
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        bookingId:
          $ref: '#/components/schemas/BookingId'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatusDetail'
        gateway:
          type: string
          examples:
            - fake
        failureCode:
          type:
            - string
            - 'null'
          examples:
            - CARD_DECLINED
        createdAt:
          $ref: '#/components/schemas/Instant'
        challenge:
          oneOf:
            - $ref: '#/components/schemas/PaymentChallenge'
            - type: 'null'
        refunded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    PriceLine:
      type: object
      description: One line of the honest price breakdown. Pay-on-board legs are listed but not charged.
      required:
        - code
        - amount
        - payOnBoard
      properties:
        code:
          type: string
          examples:
            - FARE
            - SERVICE_FEE
            - PAY_ON_BOARD
        amount:
          $ref: '#/components/schemas/Money'
        legIndex:
          type:
            - integer
            - 'null'
        payOnBoard:
          type: boolean
    BookingDisruption:
      type: object
      required:
        - id
        - bookingLegId
        - legIndex
        - kind
        - delayMinutes
        - state
        - detectedAt
      properties:
        id:
          type: string
        bookingLegId:
          $ref: '#/components/schemas/BookingLegId'
        legIndex:
          type: integer
        kind:
          type: string
          enum:
            - delayed
            - cancelled
        delayMinutes:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
        detectedAt:
          $ref: '#/components/schemas/Instant'
        suggestion:
          description: A replan suggestion from the trip planner, if one was found. Never applied automatically.
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    BookingDetail:
      type: object
      required:
        - id
        - status
        - optionId
        - legs
        - passengers
        - total
        - createdAt
        - updatedAt
        - priceBreakdown
        - disruptions
      properties:
        id:
          $ref: '#/components/schemas/BookingId'
        status:
          $ref: '#/components/schemas/BookingStatus'
        optionId:
          $ref: '#/components/schemas/TripOptionId'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/BookingLegDetail'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
        total:
          $ref: '#/components/schemas/Money'
        holdExpiresAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        payment:
          oneOf:
            - $ref: '#/components/schemas/PaymentDetail'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
        failureCode:
          type:
            - string
            - 'null'
          description: Why a `failed` booking failed, for example LEG_UNAVAILABLE or CARD_DECLINED.
        priceBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/PriceLine'
        disruptions:
          type: array
          items:
            $ref: '#/components/schemas/BookingDisruption'
    BookingPassengerInput:
      type: object
      required:
        - fullName
        - passengerType
      properties:
        travellerId:
          $ref: '#/components/schemas/TravellerId'
        fullName:
          type: string
          maxLength: 120
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        phone:
          type: string
    CreateBookingRequest:
      type: object
      required:
        - optionId
        - passengers
      properties:
        optionId:
          $ref: '#/components/schemas/TripOptionId'
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/BookingPassengerInput'
    PayRequest:
      type: object
      required:
        - method
        - paymentToken
      properties:
        method:
          type: string
          enum:
            - card
        paymentToken:
          type: string
          description: Opaque token from the payment gateway. Card numbers never reach this API. See docs/payments/GATEWAY-READINESS.md for the fake gateway tokens (`tok_fake_success`, `tok_fake_declined`, `tok_fake_insufficient_funds`, `tok_fake_verification`, `tok_fake_slow`, `tok_fake_timeout`, `tok_fake_timeout_charged`, `tok_fake_leg_failure`).
    VerifyPaymentRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 12
    CancellationLegQuote:
      type: object
      required:
        - legIndex
        - cancellable
        - policyCode
        - refundPercent
        - refund
      properties:
        legIndex:
          type: integer
        cancellable:
          type: boolean
        policyCode:
          type: string
        refundPercent:
          type: integer
          minimum: 0
          maximum: 100
        refund:
          $ref: '#/components/schemas/Money'
        reasonCode:
          type:
            - string
            - 'null'
    CancellationQuote:
      type: object
      required:
        - bookingId
        - cancellable
        - legs
        - totalRefund
        - nonRefundable
      properties:
        bookingId:
          $ref: '#/components/schemas/BookingId'
        cancellable:
          type: boolean
        legs:
          type: array
          items:
            $ref: '#/components/schemas/CancellationLegQuote'
        totalRefund:
          $ref: '#/components/schemas/Money'
        nonRefundable:
          $ref: '#/components/schemas/Money'
        reasonCode:
          type:
            - string
            - 'null'
    TicketId:
      type: string
      pattern: ^tkt_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - tkt_01K8Z3M5Q7R9T2V4W6X8Y0K1M2
    TicketStatus:
      type: string
      enum:
        - valid
        - used
        - cancelled
        - expired
    TicketDetail:
      type: object
      required:
        - id
        - bookingId
        - bookingLegId
        - passengerId
        - status
        - issuedAt
      properties:
        id:
          $ref: '#/components/schemas/TicketId'
        bookingId:
          $ref: '#/components/schemas/BookingId'
        bookingLegId:
          $ref: '#/components/schemas/BookingLegId'
        passengerId:
          $ref: '#/components/schemas/PassengerId'
        status:
          $ref: '#/components/schemas/TicketStatus'
        issuedAt:
          $ref: '#/components/schemas/Instant'
        usedAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        leg:
          oneOf:
            - $ref: '#/components/schemas/Leg'
            - type: 'null'
    VerifyTicketRequest:
      type: object
      required:
        - payload
      properties:
        payload:
          type: string
        consume:
          type: boolean
          default: false
    VerifyTicketResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        reasonCode:
          type: string
          examples:
            - TICKET_ALREADY_USED
        ticket:
          $ref: '#/components/schemas/TicketDetail'
    ProviderEventRequest:
      type: object
      required:
        - providerId
        - serviceRunId
        - state
      properties:
        providerId:
          type: string
        serviceRunId:
          type: string
        state:
          type: string
          enum:
            - on_time
            - delayed
            - cancelled
        delayMinutes:
          type: integer
          minimum: 0
          default: 0
  responses:
    ValidationFailed:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://dhathuru.mv/problems/validation
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            errors:
              - field: email
                code: INVALID_EMAIL
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://dhathuru.mv/problems/rate-limited
            title: Too many requests
            status: 429
            code: RATE_LIMITED
            params:
              retryAfterSeconds: 30
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://dhathuru.mv/problems/unauthorized
            title: Unauthorized
            status: 401
            code: AUTH_REQUIRED
    NotFound:
      description: Resource does not exist (or is not visible to the caller).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://dhathuru.mv/problems/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
    Conflict:
      description: State conflict (for example an idempotency key reused with a different body).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://dhathuru.mv/problems/conflict
            title: Conflict
            status: 409
            code: IDEMPOTENCY_KEY_REUSED
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client generated unique key (UUID or ULID). Replays return the original result.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    BookingId:
