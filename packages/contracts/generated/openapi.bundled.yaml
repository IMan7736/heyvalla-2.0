openapi: 3.1.0
info:
  title: Dhathuru API
  version: 1.0.0
  description: Door-to-door trip planning and booking for the Maldives. Errors are RFC 9457 problem+json. Money is integer minor units. Time is ISO 8601 with offset.
servers:
  - url: http://localhost:5100/v1
    description: Local API (Prism mock serves the same path on :4010)
security:
  - bearerAuth: []
tags:
  - name: Meta
    description: Platform endpoints
  - name: Auth
    description: Registration, login and token rotation
  - name: Account
    description: Profile and saved travellers
  - name: Catalog
    description: Places, operators, services and status
  - name: Trips
    description: Door-to-door trip planning
  - name: Geo
    description: Route geometry (approximate)
  - name: Bookings
    description: Holds, payment, tickets
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Meta
      summary: Liveness and readiness
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                time: '2026-10-26T20:00:00Z'
        '503':
          description: Service is up but a dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                version: 0.1.0
                time: '2026-10-26T20:00:00Z'
                checks:
                  database: down
  /health/live:
    get:
      operationId: getHealthLive
      tags:
        - Meta
      summary: Liveness probe (process is running; no dependencies checked)
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
              example:
                status: ok
  /health/ready:
    get:
      operationId: getHealthReady
      tags:
        - Meta
      summary: Readiness probe (dependencies reachable)
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
              example:
                status: ok
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: aishath@example.com
              password: correct horse battery staple
              displayName: Aishath
              locale: en
      responses:
        '202':
          description: Always returned, whether or not the address is already registered (no account enumeration). A verification email, or an "already registered" email, is sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: aishath@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.example.signature
                refreshToken: rt_example_not_a_real_token
                tokenType: Bearer
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Auth
      summary: Rotate the refresh token and get a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: rt_example_not_a_real_token
      responses:
        '200':
          description: New token pair; the old refresh token is now invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.example2.signature
                refreshToken: rt_example_rotated
                tokenType: Bearer
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Revoke the refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: rt_example_rotated
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
        - Auth
      summary: Confirm an email address with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: verify_example_token
      responses:
        '204':
          description: Email verified.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags:
        - Auth
      summary: Send the verification email again
      description: Always answers 202 so account existence is not revealed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: aishath@example.com
      responses:
        '202':
          description: If the account exists and is unverified an email was sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
        - Auth
      summary: Request a password reset email
      description: Always answers 202 so account existence is not revealed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: aishath@example.com
      responses:
        '202':
          description: If the account exists an email was sent.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags:
        - Auth
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: reset_example_token
              newPassword: a brand new long passphrase
      responses:
        '204':
          description: Password changed; all refresh tokens revoked.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me:
    get:
      operationId: getMe
      tags:
        - Account
      summary: Current user
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01K8Z3M5Q7R9T2V4W6X8Y0N1P2
                email: aishath@example.com
                emailVerified: true
                displayName: Aishath
                locale: en
                createdAt: '2026-10-26T20:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      tags:
        - Account
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              displayName: Aishath N.
              locale: en
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01K8Z3M5Q7R9T2V4W6X8Y0N1P2
                email: aishath@example.com
                emailVerified: true
                displayName: Aishath N.
                locale: en
                createdAt: '2026-10-26T20:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteMe
      tags:
        - Account
      summary: Delete the account and personal data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              password: correct horse battery staple
      responses:
        '204':
          description: Account and personal data deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong password (code PASSWORD_INCORRECT).
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/password:
    post:
      operationId: changePassword
      tags:
        - Account
      summary: Change password
      description: Revokes all other sessions. Wrong current password answers 403 PASSWORD_INCORRECT (not 401).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: correct horse battery staple
              newPassword: a brand new long passphrase
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong current password.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/email:
    post:
      operationId: changeEmail
      tags:
        - Account
      summary: Start an email change
      description: A confirmation link goes to the NEW address; confirm it with POST /auth/verify-email. Always 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            example:
              newEmail: new@example.com
              password: correct horse battery staple
      responses:
        '202':
          description: Accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong password.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/preferences:
    get:
      operationId: getPreferences
      tags:
        - Account
      summary: Preferences
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example:
                language: en
                riskTolerance: balanced
                preferredModes:
                  - ferry
                  - seaplane
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updatePreferences
      tags:
        - Account
      summary: Update preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
            example:
              riskTolerance: cautious
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example:
                language: en
                riskTolerance: cautious
                preferredModes:
                  - ferry
                  - seaplane
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/sessions:
    get:
      operationId: listSessions
      tags:
        - Account
      summary: Signed-in devices
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
              example:
                items:
                  - id: ses_01K8Z3M5Q7R9T2V4W6X8Y0N1P2
                    createdAt: '2026-10-26T20:00:00Z'
                    lastUsedAt: '2026-10-26T20:05:00Z'
                    userAgent: Firefox
                    networkHint: 203.0.113.0/24
                    current: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags:
        - Account
      summary: Sign out everywhere else
      responses:
        '204':
          description: Other sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeSession
      tags:
        - Account
      summary: Sign out one device
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/travellers:
    get:
      operationId: listTravellers
      tags:
        - Account
      summary: Saved travellers
      responses:
        '200':
          description: Saved travellers.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedTraveller'
              example:
                items:
                  - id: trv_01K8Z3M5Q7R9T2V4W6X8Y0P1Q2
                    fullName: Aishath Naseem
                    passengerType: adult
                    phone: '+9607771234'
                    documentType: none
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTraveller
      tags:
        - Account
      summary: Save a traveller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravellerInput'
            example:
              fullName: Aishath Naseem
              passengerType: adult
              phone: '+9607771234'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTraveller'
              example:
                id: trv_01K8Z3M5Q7R9T2V4W6X8Y0P1Q2
                fullName: Aishath Naseem
                passengerType: adult
                phone: '+9607771234'
                documentType: none
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/travellers/{travellerId}:
    parameters:
      - name: travellerId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TravellerId'
    patch:
      operationId: updateTraveller
      tags:
        - Account
      summary: Update a saved traveller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravellerInput'
            example:
              fullName: Aishath Naseem
              passengerType: adult
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTraveller'
              example:
                id: trv_01K8Z3M5Q7R9T2V4W6X8Y0P1Q2
                fullName: Aishath Naseem
                passengerType: adult
                documentType: none
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteTraveller
      tags:
        - Account
      summary: Remove a saved traveller
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /places:
    get:
      operationId: searchPlaces
      tags:
        - Catalog
      summary: Search places
      security: []
      parameters:
        - name: query
          in: query
          description: Free text matched against localised names and codes.
          schema:
            type: string
            maxLength: 80
          example: maaf
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/PlaceType'
        - name: near
          in: query
          description: lat,lng; results are ordered by distance.
          schema:
            type: string
            pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?$
          example: 3.94,73.49
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching places.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  page:
                    $ref: '#/components/schemas/PageInfo'
              example:
                items:
                  - id: isl_01K8Z3M5Q7R9T2V4W6X8Y0A1B2
                    type: island
                    name:
                      en: Maafushi
                      dv: މާފުށި
                    geo:
                      lat: 3.9417
                      lng: 73.4896
                    atollId: atl_01K8Z3M5Q7R9T2V4W6X8Y0A1C2
                    isHub: false
                page:
                  nextCursor: null
                  limit: 50
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /places/{placeId}:
    get:
      operationId: getPlace
      tags:
        - Catalog
      summary: One place
      security: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PlaceId'
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              example:
                id: apt_01K8Z3M5Q7R9T2V4W6X8Y0A1D2
                type: airport
                name:
                  en: Velana International Airport
                geo:
                  lat: 4.1918
                  lng: 73.5291
                code: MLE
                isHub: true
        '404':
          $ref: '#/components/responses/NotFound'
  /operators:
    get:
      operationId: listOperators
      tags:
        - Catalog
      summary: Transport operators
      security: []
      responses:
        '200':
          description: Operators.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Operator'
              example:
                items:
                  - id: opr_01K8Z3M5Q7R9T2V4W6X8Y0C1D2
                    name:
                      en: Example Ferry Operator
                    modes:
                      - ferry
                    providerId: static-example-ferry
                    providerKind: static
  /services:
    get:
      operationId: listServices
      tags:
        - Catalog
      summary: Services between two places on a date
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PlaceId'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PlaceId'
        - name: date
          in: query
          required: true
          description: Service date in Indian/Maldives local time.
          schema:
            type: string
            format: date
          example: '2026-10-27'
      responses:
        '200':
          description: Services with their departures for the date.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
              example:
                items:
                  - id: svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2
                    operatorId: opr_01K8Z3M5Q7R9T2V4W6X8Y0C1D2
                    mode: ferry
                    kind: scheduled
                    from:
                      id: isl_01K8Z3M5Q7R9T2V4W6X8Y0A1B2
                      type: island
                      name:
                        en: Maafushi
                      geo:
                        lat: 3.9417
                        lng: 73.4896
                    to:
                      id: jty_01K8Z3M5Q7R9T2V4W6X8Y0A1E2
                      type: jetty
                      name:
                        en: Hulhumalé Ferry Terminal
                      geo:
                        lat: 4.2185
                        lng: 73.5408
                    departures:
                      - serviceRunId: svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2:2026-10-27T02:30Z
                        departAt: '2026-10-27T02:30:00Z'
                        arriveAt: '2026-10-27T04:00:00Z'
                    validity:
                      from: '2026-01-01'
                      daysOfWeek:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                    fare:
                      base:
                        amountMinor: 9000
                        currency: MVR
                      pricing: fixed
                    checkInCutoffMin: 15
                    synthetic: true
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /status/services/{serviceId}:
    get:
      operationId: getServiceStatus
      tags:
        - Catalog
      summary: Live or simulated status of a service
      security: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServiceId'
        - name: serviceRunId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
              example:
                serviceId: svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2
                state: delayed
                delayMinutes: 25
                updatedAt: '2026-10-27T02:40:00Z'
                source: simulated
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/search:
    post:
      operationId: searchTrips
      tags:
        - Trips
      summary: Plan door-to-door trips
      description: |
        Returns ranked options. Every connection respects a hard minimum buffer; options that cannot be made safely are never returned.
        `date` and `time` are Indian/Maldives local time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripSearchRequest'
            example:
              from: isl_01K8Z3M5Q7R9T2V4W6X8Y0A1B2
              to: isl_01K8Z3M5Q7R9T2V4W6X8Y0A1F2
              date: '2026-10-27'
              time: '17:00'
              timeMode: arriveBy
              passengers:
                adults: 2
                children: 0
                infants: 0
              preferences:
                riskTolerance: balanced
      responses:
        '200':
          description: Ranked options (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSearchResponse'
              example:
                searchId: srch_01K8Z3M5Q7R9T2V4W6X8Y0F1G2
                options:
                  - id: trp_01K8Z3M5Q7R9T2V4W6X8Y0E1F2
                    departAt: '2026-10-27T02:30:00Z'
                    arriveAt: '2026-10-27T11:35:00Z'
                    durationMin: 545
                    transfers: 3
                    legs:
                      - id: leg_01K8Z3M5Q7R9T2V4W6X8Y0G1H2
                        mode: ferry
                        providerId: static-example-ferry
                        serviceId: svc_01K8Z3M5Q7R9T2V4W6X8Y0D1E2
                        from:
                          id: isl_01K8Z3M5Q7R9T2V4W6X8Y0A1B2
                          type: island
                          name:
                            en: Maafushi
                          geo:
                            lat: 3.9417
                            lng: 73.4896
                        to:
                          id: jty_01K8Z3M5Q7R9T2V4W6X8Y0A1E2
                          type: jetty
                          name:
                            en: Hulhumalé Ferry Terminal
                          geo:
                            lat: 4.2185
                            lng: 73.5408
                        departAt: '2026-10-27T02:30:00Z'
                        arriveAt: '2026-10-27T04:00:00Z'
