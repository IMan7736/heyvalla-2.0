      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              optionId: trp_01K8Z3M5Q7R9T2V4W6X8Y0E1F2
              passengers:
                - travellerId: trv_01K8Z3M5Q7R9T2V4W6X8Y0P1Q2
                  fullName: Aishath Naseem
                  passengerType: adult
                - fullName: Ibrahim Naseem
                  passengerType: adult
                  phone: '+9607779876'
      responses:
        '201':
          description: Held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
              examples:
                held:
                  $ref: '#/components/examples/HeldBooking'
        '401':
